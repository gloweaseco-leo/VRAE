name: L2 launch private runtime candidate
on:
  pull_request:
permissions:
  contents: read
jobs:
  private-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original optional dependency lock
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Private boundary and source checks
        run: |
          python -m pip check
          python -m ruff check --no-cache infra/l2_launch integration/l2_launch/runtime --select E4,E7,E9,F
          python -B -m unittest integration.l2_launch.runtime.test_boundary -v
      - name: Real no-route PG16, original 30s lease, SIGKILL and restore
        run: python -B -m infra.l2_launch.runner --label ci-${{ matrix.python }} --build
      - name: Publish metadata only; original CI remains unchanged
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-launch-private-${{ matrix.python }}
          retention-days: 3
          if-no-files-found: error
          path: infra/l2_launch/.private/ci-${{ matrix.python }}/public/
