name: R1A offline source safety and kernel isolation
on:
  pull_request:
    paths:
      - 'integration/l2_launch/security/**'
      - '.github/workflows/l2-launch-r1a-security.yml'
permissions:
  contents: read
jobs:
  offline-and-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
            base: python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89
          - python: '3.13'
            slug: '313'
            base: python:3.13-slim-bookworm@sha256:a5a7017efc5969e00ae2b91c8eb0631049a569652aa4ffc4501769049ae45c72
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra1a.lock
      - name: Existing source policy, candidate negatives and evidence contracts
        run: |
          python -m ruff check integration/l2_launch/security --select E4,E7,E9,F
          python -m mypy --explicit-package-bases --follow-imports=silent integration/l2_launch/security
          python -B -m pytest -q integration/l2_launch/security/offline_cases.py tests/collection/test_security.py tests/collection/test_pipeline.py tests/evidence --junitxml=integration/l2_launch/security/.runtime/contracts-${{ matrix.slug }}.xml
      - name: Recorded business cases, refusal packets and original pack reload
        run: python -B -m integration.l2_launch.security.demo hosted-${{ matrix.slug }}
      - name: Real network-none private Worker with immutable source mount
        run: python -B -m integration.l2_launch.security.lab --label kernel-${{ matrix.slug }} --base '${{ matrix.base }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-offline-security-${{ matrix.slug }}
          include-hidden-files: true
          path: |
            integration/l2_launch/security/.runtime/contracts-${{ matrix.slug }}.xml
            integration/l2_launch/security/.runtime/hosted-${{ matrix.slug }}/*.json
            integration/l2_launch/security/.runtime/kernel-${{ matrix.slug }}/receipt.json
            integration/l2_launch/security/.runtime/kernel-${{ matrix.slug }}/isolated.xml
            integration/l2_launch/security/.runtime/kernel-${{ matrix.slug }}/*.log
          if-no-files-found: error
