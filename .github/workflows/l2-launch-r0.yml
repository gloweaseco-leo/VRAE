name: R0 VF VRAE executable contract candidate
on:
  pull_request:
    paths:
      - 'contracts/l2_launch/**'
      - 'docs/03-engineering/l2-launch/**'
      - 'tests/l2_launch/**'
      - '.github/workflows/l2-launch-r0.yml'
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original locked fixture dependencies
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: New contract source standards
        run: python -m ruff check contracts/l2_launch tests/l2_launch --select E4,E7,E9,F
      - name: Offline consumer negatives and unchanged V1 domain contracts
        run: >-
          python -X utf8 -m pytest -q tests/l2_launch/consumer_cases.py tests/test_contracts.py
          tests/test_domain.py tests/test_ra0f_regressions.py
          --basetemp=docs/03-engineering/l2-launch/.runtime/pytest
          --junitxml=docs/03-engineering/l2-launch/.runtime/consumer.xml --tb=short
      - name: Frozen source and exact example replay
        if: always()
        run: >-
          python -m tests.l2_launch.evidence
          --junit docs/03-engineering/l2-launch/.runtime/consumer.xml
          --output docs/03-engineering/l2-launch/.runtime/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-launch-r0-${{ matrix.python }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            docs/03-engineering/l2-launch/.runtime/consumer.xml
            docs/03-engineering/l2-launch/.runtime/evidence.json
            contracts/l2_launch/examples/*.json
            docs/03-engineering/l2-launch/inputs.json
