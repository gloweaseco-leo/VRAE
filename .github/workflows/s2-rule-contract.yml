name: S2 native rule and read-only projection contracts
on:
  workflow_call:
    inputs:
      legacy_311:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      legacy_311:
        description: Include retained Python 3.11 compatibility and historical gates
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.legacy_311 && '{"python":["3.11","3.13"]}' || '{"python":["3.13"]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Frozen original executor and derived projection contract
        run: |
          python -m ruff check vrae/rules/execution.py vrae/rules/s2 vrae/reporting/s2_candidate.py tests/s2_contract --select E4,E7,E9,F
          python -m mypy vrae
          python -m pytest -q tests/s2_contract/p0_cases.py tests/s2_contract/p1_static_cases.py tests/s2_contract/p1_industrial_cases.py tests/s2_contract/buyer_candidate_cases.py integration/s2_ux/test_projection.py --junitxml=docs/03-engineering/s2-c1-p0/.runtime/ci-native.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-p0-native-${{ matrix.python }}
          retention-days: 7
          if-no-files-found: error
          path: docs/03-engineering/s2-c1-p0/.runtime/ci-native.xml
