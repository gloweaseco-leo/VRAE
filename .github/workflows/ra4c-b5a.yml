name: B5A signed TEST_ONLY Reviewer original read
on:
  pull_request:
permissions:
  contents: read
jobs:
  signed-reviewer-pg16-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            tag: '311'
          - python-version: '3.13'
            tag: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing locked dependencies only
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: New B5A static and pure boundary checks
        run: |
          python -m ruff check apps/operator_console/b5a_*.py integration/ra4c_b5a tests/operator_console/test_b5a_*.py --select E4,E7,E9,F
          python -m pytest -q tests/operator_console/test_b5a_boundaries.py
          node --check integration/ra4c_b5a/browser.mjs
      - name: Actual Chinese font raster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match sans-serif:lang=zh-cn
      - name: Fresh PG16 Reviewer, real signed HTTP and actual Chromium
        env:
          B5A_CHROMIUM: /usr/bin/google-chrome
          PYTHONPATH: .
        run: python -B -m integration.ra4c_b5a.run hosted-${{ matrix.tag }}
      - name: Verify bounded export even after a failed actual stage
        id: publication
        if: always()
        run: python -B -m integration.ra4c_b5a.publication verify hosted-${{ matrix.tag }}
      - name: Only scanned allowlisted evidence
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: b5a-signed-reviewer-${{ matrix.tag }}
          retention-days: 3
          path: docs/03-engineering/ra4c-b5a/evidence/hosted-${{ matrix.tag }}/
          if-no-files-found: error
