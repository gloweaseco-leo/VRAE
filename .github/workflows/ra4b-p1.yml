name: RA4B P1 private TEST_ONLY runtime
on:
  pull_request:
permissions:
  contents: read
jobs:
  private-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
          - python: '3.13'
            slug: '313'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Separate locked optional B4 dependencies
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Source checks
        run: |
          python -m compileall -q vrae/application/ra4b apps/api worker/ra4b integration/ra4b
          python -m ruff check --no-cache vrae/application/ra4b apps/api worker/ra4b integration/ra4b docs/03-engineering/ra4b-p1 --select E4,E7,E9,F
          python -m mypy --cache-dir docs/03-engineering/ra4b-p1/.runtime/mypy vrae
          python -m pip check
      - name: Actual PG16 epochs, frozen staged prelude and post-0004 compatibility
        run: python docs/03-engineering/ra4b-p1/run_full.py ci-pg-${{ matrix.slug }}
      - name: Complete ordinary regression including frozen Review127 and QA118
        run: python docs/03-engineering/ra4b-p1/unit_lab.py ci-unit-${{ matrix.slug }}
      - name: Real HTTP, independent UID Worker, SIGKILL, dead letter and actual PG recovery
        run: python docs/03-engineering/ra4b-p1/runtime_lab.py ci-runtime-${{ matrix.slug }}
      - name: Public artifact privacy gate; failure metadata only on incomplete gates
        if: always()
        run: python docs/03-engineering/ra4b-p1/ci_publication.py ${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra4b-p1-${{ matrix.slug }}
          retention-days: 3
          if-no-files-found: error
          path: docs/03-engineering/ra4b-p1/ci-public-${{ matrix.slug }}/
