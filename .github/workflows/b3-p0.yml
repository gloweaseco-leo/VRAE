name: B3 P0 TEST_ONLY atomic intents
on:
  pull_request:
permissions:
  contents: read
jobs:
  testonly-pg16-http-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            tag: '311'
          - python-version: '3.13'
            tag: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Accepted locked dependencies
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: B3 owned static checks
        run: python -m ruff check vrae/b3_p0 integration/b3_p0 tests/b3_p0 --select E4,E7,E9,F
      - name: Fresh actual PG16 transactions, HTTP, restart and independent restore
        env:
          PYTHONPATH: .
        run: python -B -m integration.b3_p0.run hosted-${{ matrix.tag }}
      - name: Bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-p0-${{ matrix.tag }}
          retention-days: 3
          path: docs/03-engineering/b3-p0/evidence/hosted-${{ matrix.tag }}/
          if-no-files-found: error
