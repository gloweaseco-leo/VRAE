name: S2 P0 native rule and read-only adapter contract
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Frozen original executor and derived projection contract
        run: |
          python -m ruff check vrae/rules/execution.py vrae/rules/s2 tests/s2_contract --select E4,E7,E9,F
          python -m mypy vrae
          python -m pytest -q tests/s2_contract/p0_cases.py integration/s2_ux/test_projection.py --junitxml=docs/03-engineering/s2-c1-p0/.runtime/ci-native.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-p0-native-${{ matrix.python }}
          retention-days: 7
          if-no-files-found: error
          path: docs/03-engineering/s2-c1-p0/.runtime/ci-native.xml
