name: S2 C3 independent offline quality and unsigned Gold packets
on:
  pull_request:
    paths:
      - 'tests/benchmark/s2_*.py'
      - 'tests/s2_quality/**'
      - 'integration/l2_ops/s2_quality_*'
      - '.github/workflows/s2-c3-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
          - python: '3.13'
            slug: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Accepted locked test dependencies
        run: python -m pip install -r requirements-ra1a.lock
      - name: C3-only standards
        run: >-
          python -m ruff check tests/benchmark/s2_quality.py tests/benchmark/s2_sites.py
          tests/benchmark/s2_review.py tests/s2_quality integration/l2_ops/s2_quality_cli.py
          integration/l2_ops/s2_quality_verify.py integration/l2_ops/s2_quality_cases.py --select E4,E7,E9,F
      - name: Native offline replay and exact old Gold compatibility
        run: >-
          python integration/l2_ops/s2_quality_verify.py --label hosted${{ matrix.slug }}
          --python-current python --base-ref ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-c3-quality-${{ matrix.slug }}
          retention-days: 7
          if-no-files-found: error
          path: docs/03-engineering/l2-operations/s2-quality/hosted${{ matrix.slug }}/
