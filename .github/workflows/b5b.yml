name: B5B accepted signed SSR private preview and blocked result boundary
on:
  pull_request:
permissions:
  contents: read
jobs:
  signed-ssr-pg16-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            tag: '311'
          - python: '3.13'
            tag: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accepted locked dependencies
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: New B5B source only
        run: |
          python -m ruff check apps/operator_console/b5b_*.py integration/b5b --select E4,E7,E9,F
          python -m mypy vrae
          python -m pip check
          node --check integration/b5b/browser.mjs
      - name: Real Chinese browser glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real PG16 signed SSR original B3 receipt and B6 deny boundary
        env:
          B5B_CHROMIUM: /usr/bin/google-chrome
          PYTHONPATH: .
        run: python -B -m integration.b5b.run hosted-${{ matrix.tag }}
      - name: Bounded scanned evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5b-${{ matrix.tag }}
          retention-days: 3
          if-no-files-found: error
          path: docs/03-engineering/b5b/evidence/hosted-${{ matrix.tag }}/
