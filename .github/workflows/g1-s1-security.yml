name: G1 S1 independent source security and HTTP gap ledger
on:
  pull_request:
    paths:
      - 'integration/l2_launch/g1_security/**'
      - '.github/workflows/g1-s1-security.yml'
permissions:
  contents: read
jobs:
  independent-rejections:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
            base: python:3.11-slim-bookworm@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89
          - python: '3.13'
            slug: '313'
            base: python:3.13-slim-bookworm@sha256:a5a7017efc5969e00ae2b91c8eb0631049a569652aa4ffc4501769049ae45c72
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Frozen source and authority unchanged
        run: >-
          git diff --exit-code 7fdeeed0f427ce3b94677ab2a480eae1556e85ca HEAD --
          vrae contracts integration/l2_launch/security integration/l2_launch/runtime
          infra/l2_launch integration/l2_ops integration/s5_ops
      - name: Independent attacks and deterministic replay
        run: |
          python -m ruff check integration/l2_launch/g1_security --select E4,E7,E9,F
          python -m mypy --explicit-package-bases --follow-imports=silent integration/l2_launch/g1_security
          python -B -m pytest -q integration/l2_launch/g1_security/security_cases.py --junitxml=integration/l2_launch/g1_security/.runtime/security-${{ matrix.slug }}.xml
          python -B -m integration.l2_launch.g1_security.replay --label replay-${{ matrix.slug }}
      - name: Accepted kernel probe without changing its code
        run: python -B -m integration.l2_launch.g1_security.kernel_replay --label kernel-${{ matrix.slug }} --base '${{ matrix.base }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-s1-independent-${{ matrix.slug }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            integration/l2_launch/g1_security/.runtime/security-${{ matrix.slug }}.xml
            integration/l2_launch/g1_security/.runtime/replay-${{ matrix.slug }}/*.json
            integration/l2_launch/g1_security/.runtime/g1s1-kernel-${{ matrix.slug }}/*.json
            integration/l2_launch/g1_security/.runtime/g1s1-kernel-${{ matrix.slug }}/*.xml
            integration/l2_launch/g1_security/.runtime/g1s1-kernel-${{ matrix.slug }}/*.log
