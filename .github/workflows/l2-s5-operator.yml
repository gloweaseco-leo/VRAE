name: S5 single operator S2 S3 S4 assembly
on:
  pull_request:
    paths:
      - 'integration/s5_ops/**'
      - 'integration/l2_executive/**'
      - 'vrae/l2/executive.py'
      - 'vrae/l2_ops/intake*'
      - 'apps/operator_console/l2*'
      - 'integration/l2_ops/**'
      - 'integration/beta_review/codex3/**'
      - '.github/workflows/l2-s5-operator.yml'
permissions:
  contents: read
jobs:
  real-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
          - python: '3.13'
            slug: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Chinese glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: S5 standards and authority regressions
        run: |
          python -m ruff check integration/s5_ops --select E4,E7,E9,F
          python -m mypy --explicit-package-bases --follow-imports=silent integration/s5_ops
          python -m pytest -q integration/s5_ops/test_ports.py integration/l2_ops/checks/test_s2_acceptance_sources.py integration/l2_ops/checks/test_native_tasks.py integration/l2_ops/checks/test_executive.py integration/l2_ops/checks/test_intake.py integration/l2_ops/checks/test_s4_joint.py --junitxml=integration/s5_ops/.private/native-${{ matrix.slug }}.xml
      - name: Original dependency-only Worker image
        run: python integration/l2_ops/build_image.py --python ${{ matrix.python }}
      - name: Actual APP202 PG16 Worker signed SSR Chrome and restart
        env:
          B5B_CHROMIUM: /usr/bin/google-chrome
        run: python -m integration.l2_ops.s2_acceptance_runtime --s5 --run s5-ci-${{ matrix.slug }} --minor ${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s5-operator-${{ matrix.slug }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            docs/03-engineering/l2-operations/s5-ci-${{ matrix.slug }}/
            integration/s5_ops/.private/native-${{ matrix.slug }}.xml
