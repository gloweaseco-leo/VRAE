name: L2 industrial buyer diagnosis
on:
  workflow_call:
    inputs:
      legacy_311:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      legacy_311:
        description: Include retained Python 3.11 compatibility and historical gates
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  industry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.legacy_311 && '{"python":["3.11","3.13"]}' || '{"python":["3.13"]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: New industry code and unchanged native type checks
        run: |
          python -m ruff check vrae/industry integration/industry_l2 tests/industry --select E4,E7,E9,F
          python -m mypy vrae
      - name: Native Collector to Guard and industrial business semantics
        run: python -m pytest -q tests/industry/l2_cases.py --junitxml=docs/03-engineering/l2-industrial-v1/.runtime/ci-native.xml
      - name: Actual eight-page offline diagnosis
        run: python -m integration.industry_l2.demo --output docs/03-engineering/l2-industrial-v1/.runtime/ci-demo
      - name: Preserve exact tests and actual synthetic result
        if: always()
        run: python -m integration.industry_l2.publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-l2-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7
          path: docs/03-engineering/l2-industrial-v1/.runtime/public-ci/
