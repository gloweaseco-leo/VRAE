name: S2 C3 accepted C2 combination verification
on:
  pull_request:
    paths:
      - 'tests/benchmark/s2_*.py'
      - 'tests/s2_quality/**'
      - 'integration/l2_ops/s2_quality_*'
      - '.github/workflows/s2-c3-quality.yml'
      - '.github/workflows/s2-c3-accepted-c2.yml'
permissions:
  contents: read
jobs:
  accepted-c2-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accepted C2 locked dependencies
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Accepted C2 standards
        run: |
          python -m ruff check vrae/rules/s2_ux.py integration/s2_ux --select E4,E7,E9,F
          python -m mypy vrae
      - name: Accepted C2 original projection and isolation suite
        run: python -B -m pytest -q integration/s2_ux/test_projection.py tests/evidence tests/rules -p no:cacheprovider --junitxml=integration/s2_ux/.runtime/native.xml
      - name: Accepted C2 Chrome offline viewport verification
        env:
          L2_CHROMIUM: /usr/bin/google-chrome
        run: node integration/s2_ux/browser.mjs c3-combination-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-c3-accepted-c2-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            integration/s2_ux/.runtime/*.xml
            integration/s2_ux/.runtime/c3-combination-ci/*.json
            integration/s2_ux/.runtime/c3-combination-ci/*.png
            integration/s2_ux/.runtime/c3-combination-ci/*.log
