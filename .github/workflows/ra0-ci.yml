name: RA-0 offline contract and domain CI

on:
  pull_request:
  push:
    branches:
      - feat/ra0-contracts-domain-foundation

permissions:
  contents: read

jobs:
  contracts-domain:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q vrae
      - run: ruff check vrae tests --select E4,E7,E9,F
      - run: mypy vrae
      - run: python -m pytest -q
      - run: python -m pip check
