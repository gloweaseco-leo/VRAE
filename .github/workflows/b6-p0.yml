name: B6-P0 private handoff and unconditional delivery denial
on:
  pull_request:
permissions:
  contents: read
jobs:
  private-handoff-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            tag: '311'
          - python-version: '3.13'
            tag: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Accepted locked dependencies only
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: New B6 source and schema boundaries
        run: |
          python -m ruff check vrae/b6_p0 integration/b6_p0 tests/b6_p0 --select E4,E7,E9,F
          python -m mypy vrae
      - name: Real PG16 originals, signed low-role packaging and permanent DENY matrix
        env:
          PYTHONPATH: .
        run: python -B -m integration.b6_p0.run hosted-${{ matrix.tag }}
      - name: Bounded sanitized private-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6-p0-${{ matrix.tag }}
          retention-days: 3
          path: docs/03-engineering/b6-p0/evidence/hosted-${{ matrix.tag }}/
          if-no-files-found: error
