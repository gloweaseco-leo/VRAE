name: S2 C2 bounded browser evidence P0
on:
  workflow_call:
    inputs:
      legacy_311:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      legacy_311:
        description: Include retained Python 3.11 compatibility and historical gates
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  projection-and-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.legacy_311 && '{"python":["3.11","3.13"]}' || '{"python":["3.13"]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - run: python -m ruff check vrae/rules/s2_ux.py integration/s2_ux --select E4,E7,E9,F
      - run: python -m mypy vrae
      - name: Original references, scope/time isolation and missing measurement negatives
        run: python -B -m pytest -q integration/s2_ux/test_projection.py tests/evidence tests/rules -p no:cacheprovider --junitxml=integration/s2_ux/.runtime/native.xml
      - name: Real Chrome, offline fixtures, original DOM and diagnostic-only 375/320 regressions
        env:
          L2_CHROMIUM: /usr/bin/google-chrome
        run: node integration/s2_ux/browser.mjs ci-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-ux-p0-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            integration/s2_ux/.runtime/*.xml
            integration/s2_ux/.runtime/ci-browser/*.json
            integration/s2_ux/.runtime/ci-browser/*.png
            integration/s2_ux/.runtime/ci-browser/*.log
