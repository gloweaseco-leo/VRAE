name: S2 C2 bounded evidence and signed five-dimensional reading
on:
  pull_request:
    paths:
      - 'vrae/rules/s2_ux.py'
      - 'integration/s2_ux/**'
      - 'apps/operator_console/l2*'
      - 'integration/l2/lab.py'
      - 'integration/l2/browser.mjs'
      - '.github/workflows/s2-ux.yml'
permissions:
  contents: read
jobs:
  projection-and-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - run: python -m ruff check vrae/rules/s2_ux.py apps/operator_console/l2_buyer_views.py integration/s2_ux integration/l2/lab.py --select E4,E7,E9,F
      - run: python -m mypy vrae
      - name: Original references, scope/time isolation and missing measurement negatives
        run: python -B -m pytest -q integration/s2_ux integration/l2/test_l2.py integration/l2/test_codex1.py tests/s2_contract/p0_cases.py tests/evidence tests/rules -p no:cacheprovider --junitxml=integration/s2_ux/.runtime/native.xml
      - name: Real Chrome, offline fixtures, original DOM and diagnostic-only 375/320 regressions
        env:
          L2_CHROMIUM: /usr/bin/google-chrome
        run: node integration/s2_ux/browser.mjs ci-browser --rich-poc
      - name: Chinese glyphs for actual SSR and report PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Original signed SSR, five-dimensional reading, review/version/revocation/restart and PDF
        env:
          L2_CHROMIUM: /usr/bin/google-chrome
        run: python -B -m integration.l2.lab s2-p1-ci --s2-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-ux-p1-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            integration/s2_ux/.runtime/*.xml
            integration/s2_ux/.runtime/ci-browser/*.json
            integration/s2_ux/.runtime/ci-browser/*.png
            integration/s2_ux/.runtime/ci-browser/*.log
            integration/l2/.runtime/s2-p1-ci/browser.json
            integration/l2/.runtime/s2-p1-ci/assertions.json
            integration/l2/.runtime/s2-p1-ci/browser-failure.json
            integration/l2/.runtime/s2-p1-ci/browser-cleanup.json
            integration/l2/.runtime/s2-p1-ci/process-cleanup.json
            integration/l2/.runtime/s2-p1-ci/run.json
            integration/l2/.runtime/s2-p1-ci/*.png
            integration/l2/.runtime/s2-p1-ci/*.pdf
            integration/l2/.runtime/s2-p1-ci-native/browser.json
            integration/l2/.runtime/s2-p1-ci-native/assertions.json
            integration/l2/.runtime/s2-p1-ci-native/browser-failure.json
            integration/l2/.runtime/s2-p1-ci-native/browser-cleanup.json
            integration/l2/.runtime/s2-p1-ci-native/process-cleanup.json
            integration/l2/.runtime/s2-p1-ci-native/run.json
            integration/l2/.runtime/s2-p1-ci-native/*.png
            integration/l2/.runtime/s2-p1-ci-native/*.pdf
