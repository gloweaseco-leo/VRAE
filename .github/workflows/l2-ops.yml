name: L2 controlled source and internal RebuildBrief PG16
on:
  workflow_call:
    inputs:
      legacy_311:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      legacy_311:
        description: Include retained Python 3.11 compatibility and historical gates
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  l2-ops-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.legacy_311 && '{"include":[{"python":"3.11","slug":"311"},{"python":"3.13","slug":"313"}]}' || '{"include":[{"python":"3.13","slug":"313"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Existing locked dependencies
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: New L2 lint and original type standards
        run: |
          python -m ruff check vrae/l2_ops integration/l2_ops --select E4,E7,E9,F
          python -m mypy vrae
      - name: Pinned PostgreSQL16
        run: docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      - name: Explicit native L2 suite, real commit and PG restart
        run: >-
          python integration/l2_ops/verify.py --label hosted${{ matrix.slug }}
          --python-current python
          --pg-image postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      - name: Accepted dependency-only Worker image
        run: python integration/l2_ops/build_image.py --python ${{ matrix.python }}
      - name: Real industrial APP202 and independent Worker signed evidence intake
        run: >-
          python scripts/beta_internal.py l2 worker-intake
          --label hostedintake${{ matrix.slug }} --minor ${{ matrix.python }}
          --source-profile industrial-p40-v3 --native-l2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-ops-native-pg16-${{ matrix.slug }}
          retention-days: 7
          if-no-files-found: error
          path: |
            docs/03-engineering/l2-operations/hosted${{ matrix.slug }}/
            docs/03-engineering/l2-operations/hostedintake${{ matrix.slug }}/
