name: RA4A P1 real PostgreSQL 16
on:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Existing locked runtime and separate pinned PG driver
        run: |
          python -m pip install -e '.[dev]' -c requirements-ra1a.lock
          python -m pip install -r requirements-ra4a.lock -c requirements-ra1a.lock
      - name: Start owned synthetic PG16 lab on host loopback
        run: python infra/ra4a/lab.py start
      - name: Real migrations RLS transactions leases backup and restore
        run: python infra/ra4a/run.py docs/03-engineering/ra4a-p1/ci-${{ matrix.python-version }}
      - name: Remove only owned lab and record teardown
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          if Path('infra/ra4a/.venv/lab-state.json').exists():
              subprocess.run([sys.executable, 'infra/ra4a/lab.py', 'stop', '--output',
                              'docs/03-engineering/ra4a-p1/ci-${{ matrix.python-version }}/teardown'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra4a-pg16-${{ matrix.python-version }}
          path: docs/03-engineering/ra4a-p1/ci-${{ matrix.python-version }}/
