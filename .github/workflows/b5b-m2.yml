name: M2 actual generated L1 internal review and A4
on:
  pull_request:
permissions:
  contents: read
jobs:
  generated-review-pg16-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            slug: '311'
          - python: '3.13'
            slug: '313'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accepted pinned dependencies
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Focused M2 source checks
        run: |
          python -m ruff check apps/operator_console/b5b_*.py integration/b5b/m2*.py --select E4,E7,E9,F
          python -m mypy vrae
          node --check integration/b5b/m2_browser.mjs
      - name: Real Chinese browser glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Original pinned Python image only
        run: python docs/03-engineering/ra4b-p1/runtime_lab.py m2-build-${{ matrix.slug }} --build-only --private-output
      - name: Real Worker result, PG16 receipts/restart, same SSR and Chrome A4
        env:
          B5B_M2_BROWSER: '1'
          B5B_CHROMIUM: /usr/bin/google-chrome
        run: python -B -m integration.b5b.m2_lab ${{ matrix.slug }} ci-${{ matrix.slug }}
      - name: Scan and publish exact native evidence only
        if: always()
        run: python -B -m integration.b5b.m2_publish ci-${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b5b-m2-${{ matrix.slug }}
          retention-days: 7
          if-no-files-found: error
          path: docs/03-engineering/b5b/evidence/m2-ci-${{ matrix.slug }}/
