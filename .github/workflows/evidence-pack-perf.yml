name: EvidencePack instance consistency performance
on:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Isolated new tests and single runtime file
        run: |
          python -m ruff check vrae/evidence/pack.py tests/evidence_perf integration/evidence_perf --select E4,E7,E9,F
          python -m mypy vrae/evidence/pack.py
          python -m pytest -q tests/evidence_perf/instance_cases.py --junitxml=docs/03-engineering/evidence-pack-perf/.runtime/ci-safety.xml
          python -m pytest -q tests/evidence_perf/freeze_cases.py --junitxml=docs/03-engineering/evidence-pack-perf/.runtime/ci-freeze.xml
      - name: Original producer and mandatory Guard replay, baseline versus candidate
        run: python -m integration.evidence_perf.compare --out docs/03-engineering/evidence-pack-perf/.runtime/ci-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-pack-perf-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7
          path: |
            docs/03-engineering/evidence-pack-perf/.runtime/ci-safety.xml
            docs/03-engineering/evidence-pack-perf/.runtime/ci-freeze.xml
            docs/03-engineering/evidence-pack-perf/.runtime/ci-comparison/*.json
            docs/03-engineering/evidence-pack-perf/.runtime/ci-comparison/*.log
