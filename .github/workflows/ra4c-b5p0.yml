name: B5-P0 signed Reviewer atomic TEST_ONLY rehearsal
on:
  pull_request:
permissions:
  contents: read
jobs:
  signed-rehearsal-pg16-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            tag: '311'
          - python-version: '3.13'
            tag: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Accepted locked dependencies
        run: python -m pip install -r requirements-ra1a.lock -r requirements-ra4a-p2b2a.lock
      - name: New owned source boundaries
        run: |
          python -m ruff check apps/operator_console/b5p0_*.py integration/ra4c_b5p0 tests/operator_console/test_b5p0_*.py --select E4,E7,E9,F
          node --check integration/ra4c_b5p0/browser.mjs
      - name: Actual Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real signed HTTP, PG16 atomic intent and same SSR Chromium
        env:
          B5P0_CHROMIUM: /usr/bin/google-chrome
          PYTHONPATH: .
        run: python -B -m integration.ra4c_b5p0.run hosted-${{ matrix.tag }}
      - name: Bounded scanned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-p0-${{ matrix.tag }}
          retention-days: 3
          path: docs/03-engineering/ra4c-b5p0/evidence/hosted-${{ matrix.tag }}/
          if-no-files-found: error
