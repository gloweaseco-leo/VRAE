name: B7-P1 deterministic six-schema three-DB TEST_ONLY recovery
on:
  pull_request:
    paths:
      - 'integration/beta_review/codex3/b7_restore_v1/**'
      - 'docs/03-engineering/beta-closure/codex3/b7_restore_v1/**'
      - '.github/workflows/beta-b7p1-six-schema.yml'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            minor: '311'
          - python: '3.13'
            minor: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Accepted dependency locks
        run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Static checks
        run: |
          python -m ruff check --no-cache integration/beta_review/codex3/b7_restore_v1 --select E4,E7,E9,F
          python -m pip check
      - name: Dependency-only native Worker image from accepted Dockerfile
        env:
          MINOR: ${{ matrix.minor }}
          PYVER: ${{ matrix.python }}
        run: |
          python -c "import json,os,subprocess; from pathlib import Path; p=Path('integration/beta_review/codex3/b7_restore_v1/.private/image'); p.mkdir(parents=True); import shutil; [shutil.copyfile(n,p/n) for n in ['requirements-ra1a.lock','requirements-ra4a.lock','requirements-ra4b-p1.lock']]; shutil.copyfile('integration/ra4b/Dockerfile',p/'Dockerfile'); base=json.loads(Path('integration/ra4b/python-images.json').read_text())[os.environ['PYVER']]; subprocess.run(['docker','build','--build-arg','PYTHON_BASE='+base,'-t','vrae-ra4b-p1:'+os.environ['MINOR'],str(p)],check=True)"
          docker pull "$(cat infra/ra4a/image.txt)"
      - name: One genuine native three-DB recovery experiment
        run: python -B -m integration.beta_review.codex3.b7_restore_v1.run --run-id hosted-${{ matrix.minor }}
      - name: Verify sanitized publication inventory
        id: publication
        if: always()
        run: >-
          python -c "import json,hashlib; from pathlib import Path;
          p=Path('docs/03-engineering/beta-closure/codex3/b7_restore_v1/hosted-${{ matrix.minor }}');
          g=json.loads((p/'publication.json').read_text());
          assert g['publication_allowed'] and g['actual_fixture_credentials_compared']>0;
          assert {f.relative_to(p).as_posix() for f in p.rglob('*') if f.is_file()}==set(g['artifact_file_sha256'])|{'publication.json'};
          assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in g['artifact_file_sha256'].items())"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publication.outcome == 'success'
        with:
          name: b7-restore-v1-${{ matrix.minor }}
          retention-days: 3
          if-no-files-found: error
          path: docs/03-engineering/beta-closure/codex3/b7_restore_v1/hosted-${{ matrix.minor }}/
