name: C2 controlled S2 source reading workbench
on:
  pull_request:
    paths:
      - 'integration/s2_buyer_workbench/**'
      - 'integration/s2_cta/**'
      - '.github/workflows/s2-buyer-workbench.yml'
permissions:
  contents: read
jobs:
  source-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            slug: '311'
          - python-version: '3.13'
            slug: '313'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing locked dependencies and Chinese glyph prerequisite
        run: |
          python -m pip install -r requirements-ra4b-p1.lock
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Scoped CTA source checks
        run: |
          python -m ruff check integration/s2_cta --select E4,E7,E9,F
          node --check integration/s2_cta/capture.mjs
          node --check integration/s2_cta/journey.mjs
      - name: Signed access, candidate replay and original review contracts
        run: >-
          python -B -m pytest -q integration/s2_buyer_workbench
          integration/l2/test_l2.py integration/l2/test_codex1.py
          tests/s2_contract/p1_industrial_cases.py
          tests/s2_contract/buyer_candidate_cases.py
          integration/s2_cta
          --junitxml=integration/s2_buyer_workbench/native.xml
      - name: Actual controlled signed HTTP, original SSR and Chrome viewports
        env:
          RA4C0_CHROMIUM: /usr/bin/google-chrome
        run: python -B -m integration.s2_buyer_workbench.lab hosted-${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-buyer-source-reading-${{ matrix.python-version }}
          path: |
            integration/s2_buyer_workbench/native.xml
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/browser.json
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/source.json
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/process-cleanup.json
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/*.png
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/cta/receipt.json
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/cta/cleanup.json
            integration/s2_buyer_workbench/.runtime/hosted-${{ matrix.slug }}/cta/*.png
          include-hidden-files: true
          if-no-files-found: error
