name: Windows actual public Funnel mTLS
on:
  pull_request:
    paths:
      - 'infra/windows_service/**'
      - 'integration/authorized_targets/**'
      - 'infra/authorized_targets/007_automatic_sessions.sql'
      - '.github/workflows/windows-public-service.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'health verifies current public mTLS; full requires current invited source and actual human grants'
        type: choice
        options: [health, full, ai]
        default: health
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vrae_ra4a_p1
          POSTGRES_PASSWORD: synthetic-automatic-pg-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - run: python -B -m pytest -q infra/windows_service/checks
      - run: python -B -m pytest -q integration/authorized_targets/checks/test_automatic_session_http.py integration/authorized_targets/checks/test_deterministic_result.py integration/authorized_targets/checks/test_universal_sources.py integration/authorized_targets/checks/test_partial_context.py integration/authorized_targets/checks/test_content_sources.py integration/authorized_targets/checks/test_product_scope.py integration/authorized_targets/checks/test_delivery_details.py
      - name: Retained-context roles, local link failures and commercial claim refusals
        run: python -B -m pytest -q integration/authorized_targets/checks/test_retained_context.py
      - name: Bounded replay computation and original lease budget
        run: python -B -m pytest -q integration/authorized_targets/checks/test_lease_compute_budget.py
      - name: Scoped procurement source review and preserved unknowns
        run: python -B -m pytest -q integration/authorized_targets/checks/test_procurement_review.py
      - name: Five-task buyer review and bounded original paths
        run: python -B -m pytest -q integration/authorized_targets/checks/test_buyer_review.py
      - name: Five-task VF consumer and product-scope refusals
        run: node --test integration/authorized_targets/consumer/reference.test.mjs
      - run: python -B -m pytest -q integration/authorized_targets/checks/test_inventory_budget.py tests/rules/seo01_patch_cases.py
      - run: python -B -m pytest -q integration/authorized_targets/checks/test_automatic_pg.py
        env:
          VRAE_AUTOMATIC_PG_TEST: '1'
  actual-public:
    # Real clients, source consent and human MFA expire independently of Git.
    # Retain offline PR boundaries; explicitly dispatch real live operations.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: vrae-windows-actual-public
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ra4b-p1.lock
      - name: Actual public mTLS and forbidden client cases
        env:
          VRAE_WINDOWS_PUBLIC_MTLS: ${{ secrets.VRAE_WINDOWS_PUBLIC_MTLS }}
        run: |
          umask 077
          mkdir -p public-receipts
          python -B -m infra.windows_service.probe_from_environment > public-receipts/public-mtls.json
      - name: Actual sequential invited URL captures
        if: ${{ inputs.mode != 'health' }}
        env:
          VRAE_WINDOWS_PUBLIC_MTLS: ${{ secrets.VRAE_WINDOWS_PUBLIC_MTLS }}
        run: python -B -m infra.windows_service.acceptance_client
      - name: Actual directed formal report and isolation
        if: ${{ inputs.mode == 'full' }}
        env:
          VRAE_WINDOWS_PUBLIC_MTLS: ${{ secrets.VRAE_WINDOWS_PUBLIC_MTLS }}
        run: python -B -m infra.windows_service.report_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-windows-public-mtls
          path: public-receipts/*.json
          if-no-files-found: error
          retention-days: 3
